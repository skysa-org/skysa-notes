# Dependency updates.
#
# Weekly rather than daily: this is a small project and a pull request per
# patch bump on a Monday morning is a queue nobody reads. Grouped rather than
# one per package, for the same reason — a lockfile bump that touches nine
# transitive dependencies is one review, not nine.
#
# Everything is grouped except **major** updates, which are left out of the
# group deliberately: a major is a decision, and bundling one with a pile of
# patches means the decision gets merged without being made. Dependabot opens
# a pull request of its own for each one, because a dependency whose only
# available bump is excluded from every group is raised on its own.
#
# Note what is *not* here: an `ignore` entry for majors. `ignore` means "never
# raise this at all", and it is applied before grouping — so it would not
# separate majors, it would hide them, and the repository would sit on an
# unmaintained major line with this file claiming the opposite.
version: 2

updates:
    - package-ecosystem: npm
      directory: /
      # pnpm workspaces: Dependabot reads the root lockfile and covers every
      # package in it, so `apps/*` and `packages/*` need no entries of their own.
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          patch-and-minor:
              update-types:
                  - minor
                  - patch
      labels:
          - dependencies

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          actions:
              patterns:
                  - '*'
      labels:
          - dependencies

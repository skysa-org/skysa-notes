# Dependency updates.
#
# Weekly rather than daily: this is a small project and a pull request per
# patch bump on a Monday morning is a queue nobody reads. Grouped rather than
# one per package, for the same reason — a lockfile bump that touches nine
# transitive dependencies is one review, not nine.
#
# Everything is grouped except **major** updates, which are separated
# deliberately: a major is a decision, and bundling one with a pile of patches
# means the decision gets merged without being made.
version: 2

updates:
    - package-ecosystem: npm
      directory: /
      # pnpm workspaces: Dependabot reads the root lockfile and covers every
      # package in it, so `apps/*` and `packages/*` need no entries of their own.
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          patch-and-minor:
              update-types:
                  - minor
                  - patch
      # A major of any of these changes how the app is written, not just what it
      # depends on. Each gets its own pull request and its own read.
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
      labels:
          - dependencies

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          actions:
              patterns:
                  - '*'
      labels:
          - dependencies
          - ci

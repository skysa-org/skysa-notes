name: CI

on:
    push:
        branches: [main]
    pull_request:

# Nothing here reads a secret or writes to the repo.
permissions:
    contents: read

# A second push to the same branch cancels the first: nothing is learned from
# finishing a run against code that has already been replaced. Pull requests
# only — on `main` every commit is one someone may need the result for, and a
# merge that cancels the previous merge's run leaves it with no result at all.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        runs-on: ubuntu-latest
        # The whole gate runs in well under two minutes; this is only so a hung
        # vitest or wrangler cannot sit there for the default six hours.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  # The changeset check below compares against the base branch,
                  # which a shallow clone does not have.
                  fetch-depth: 0

            # Before setup-node, which needs the package manager on PATH to resolve
            # its cache. The version comes from `packageManager` in package.json.
            - run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # The same gate the README tells humans to run before every commit, so
            # the two cannot drift: format:check + lint + typecheck + test.
            - run: pnpm verify

            # A pull request that changes what ships has to say what it does
            # to the version. `pnpm run changeset --empty` is the answer for
            # one that changes nothing observable, and is a real answer rather
            # than a way round this.
            #
            # Only on a pull request: `--since` needs something to compare to,
            # and on `main` that would be the commit itself. It passes when no
            # package changed, so a documentation or workflow change needs
            # nothing.
            - name: A changeset, for a change that ships
              if: github.event_name == 'pull_request'
              env:
                  BASE: ${{ github.base_ref }}
              run: |
                  set -eu
                  changed=$(git diff --name-only "origin/$BASE...HEAD" -- apps packages)

                  # The release pull request is the one shape that cannot
                  # satisfy this and must not be asked to. `changeset version`
                  # bumps the three `package.json` files, writes the changelogs
                  # and **deletes** every changeset it consumed — so the diff is
                  # three changed packages and no changesets, which is exactly
                  # what this step exists to reject. Left in, no release could
                  # ever be merged once `verify` is required: the same gridlock
                  # the Changesets bot was turned down for, arriving from the
                  # other side.
                  #
                  # Recognised by shape rather than by branch name, which anyone
                  # could adopt: a version pull request touches nothing in a
                  # package but its `package.json` and its `CHANGELOG.md`. A
                  # source file alongside them is not a release and is asked for
                  # a changeset like anything else.
                  #
                  # A dependency bump — Dependabot's, or one by hand — has the
                  # same shape and is let through for a reason of its own: the
                  # bot cannot write a changeset, and a rule that turns every
                  # dependency pull request red is one people learn to ignore.
                  # Where a bump is worth a line in the changelog, add one.
                  rest=$(printf '%s\n' "$changed" | grep -vE '(^|/)(package\.json|CHANGELOG\.md)$' || true)
                  if [ -n "$changed" ] && [ -z "$rest" ]; then
                    echo "Only versions, changelogs and dependency ranges changed. No changeset needed."
                    exit 0
                  fi

                  pnpm exec changeset status --since="origin/$BASE"

            # Separate, and not merged into `verify`, because it is the only thing
            # that checks two claims nothing else does: `packages/core` compiles
            # under `tsconfig.build.json` with `types: []` — which is what enforces
            # "no Node-only dependencies" — and the Worker still bundles, via
            # `wrangler deploy --dry-run`.
            - run: pnpm build

            # Advisory. Both current advisories are dev-only and transitive, so
            # gating on them would red-light every run without telling us anything
            # about what ships.
            - run: pnpm audit --prod
              continue-on-error: true

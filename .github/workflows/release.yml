name: Release

# A `vX.Y.Z` tag and a GitHub release, cut from what is already on `main`.
#
# It does not decide anything. `pnpm run changeset:version` is run by hand and
# merged like any other change; this only notices that the version in the tree
# is one that has never been tagged, and marks the commit that carries it.
# Re-running it, or pushing anything else to `main`, does nothing.
#
# Deliberately not the Changesets "Version Packages" bot. A pull request opened
# with `GITHUB_TOKEN` starts no workflows, so its own CI would never run — and
# once `verify` is a required status check, a pull request whose checks cannot
# run is one that can never be merged.

on:
    push:
        branches: [main]

# The tag and the release. Nothing else, and no pull-request scopes: this
# workflow neither reads nor writes one.
permissions:
    contents: write

# Two pushes to `main` in quick succession must not both try to create the same
# tag. Not cancelled in flight: the loser here would be a release that had
# already been pushed.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    tag:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  # Tags, so "has this version been released already?" can be
                  # answered without asking the API.
                  fetch-depth: 0

            # Any of the three would do — `.changeset/config.json` fixes them
            # to one number — and `packages/core` is the one every other
            # package depends on.
            - id: version
              run: printf 'value=%s\n' "$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Tag and release, if this version is new
              env:
                  # Through the environment rather than interpolated into the
                  # script. The value comes from a file in the repository, so
                  # it is already reviewed code — but a workflow that pastes
                  # file contents into a shell is a habit worth not having.
                  VERSION: ${{ steps.version.outputs.value }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -eu
                  if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                    echo "v$VERSION is already tagged. Nothing to release."
                    exit 0
                  fi

                  # The changelog entries Changesets wrote for this version, one
                  # section per package that has one. A package that moved only
                  # because the others did gets the literal "No changes in this
                  # release.", which is worth nothing in a release note and is
                  # dropped — as is a section that is only whitespace.
                  : > notes.md
                  for package in packages/core apps/web apps/api; do
                    log="$package/CHANGELOG.md"
                    [ -f "$log" ] || continue
                    section=$(awk -v want="## $VERSION" '
                      $0 == want { inside = 1; next }
                      inside && /^## / { exit }
                      inside && $0 != "No changes in this release." { print }
                    ' "$log")
                    case $section in
                      *[![:space:]]*)
                        name=$(node -p "require('./$package/package.json').name")
                        # `##`, so the `###` headings Changesets writes nest
                        # underneath rather than beside.
                        printf '## %s\n%s\n\n' "$name" "$section" >> notes.md
                        ;;
                    esac
                  done
                  if [ ! -s notes.md ]; then
                    printf 'No changelog entries for this version.\n' > notes.md
                  fi

                  git -c user.name='github-actions[bot]' \
                      -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      tag -a "v$VERSION" -m "v$VERSION"
                  git push origin "v$VERSION"
                  gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md

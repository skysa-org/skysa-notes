packages:
    - 'apps/*'
    - 'packages/*'

# One version for a dependency every package uses, so the three cannot drift
# apart. A package names it as `"catalog:"`; the range is set here.
catalog:
    '@types/node': ^26.6.6
    vitest: ^5.1.0
    zod: ^4.6.7

# Native/postinstall builds we accept. Everything else is blocked by default.
onlyBuiltDependencies:
    - esbuild
    - workerd
